name: Diagnose Webview Install

on:
  pull_request:
    branches: [main]
    paths:
      - "webview-ui/package.json"
      - "webview-ui/package-lock.json"
      - ".github/workflows/diagnose-webview-install.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose webview npm ci
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Record tool versions
        run: |
          node --version
          npm --version

      - name: Run clean webview install and capture diagnostics
        id: install
        continue-on-error: true
        run: |
          set +e
          cd webview-ui
          npm ci --verbose > ../webview-npm-ci-${{ runner.os }}.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Show diagnostic tail
        if: always()
        run: |
          echo "npm ci exit code: ${{ steps.install.outputs.exit_code }}"
          tail -n 160 "webview-npm-ci-${{ runner.os }}.log" || true

      - name: Upload complete diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webview-npm-ci-${{ runner.os }}
          path: webview-npm-ci-${{ runner.os }}.log
          if-no-files-found: error

      - name: Fail when npm ci failed
        if: steps.install.outputs.exit_code != '0'
        run: exit 1
