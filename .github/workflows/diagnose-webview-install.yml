name: Repair Webview Lockfile

on:
  pull_request:
    branches: [main]
    paths:
      - "webview-ui/package.json"
      - "webview-ui/package-lock.json"
      - ".github/workflows/diagnose-webview-install.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-lockfile:
    name: Regenerate and verify lockfile
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate webview lockfile
        run: |
          cd webview-ui
          npm install --package-lock-only --ignore-scripts

      - name: Verify clean install on Linux
        run: |
          cd webview-ui
          npm ci

      - name: Upload repaired lockfile
        uses: actions/upload-artifact@v4
        with:
          name: repaired-webview-lockfile
          path: webview-ui/package-lock.json
          if-no-files-found: error

      - name: Commit repaired lockfile to branch
        run: |
          if git diff --quiet -- webview-ui/package-lock.json; then
            echo "Lockfile was already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webview-ui/package-lock.json
          git commit -m "fix: synchronize webview package lock"
          target="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git push origin "HEAD:${target}"

  verify-lockfile:
    name: Verify webview npm ci (${{ matrix.os }})
    needs: repair-lockfile
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download repaired lockfile
        uses: actions/download-artifact@v4
        with:
          name: repaired-webview-lockfile
          path: webview-ui

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify clean webview install
        run: |
          cd webview-ui
          npm ci
